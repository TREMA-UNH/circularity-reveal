[project]
name = "circularity-reveal"
version = "0.1.0"
description = "Reveal circular systems in LLM-judge evaluation from paired nugget-bank leaderboards."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
plot = ["matplotlib>=3.6"]
test = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/circularity_reveal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
